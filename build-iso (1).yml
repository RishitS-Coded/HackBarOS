name: Build HackBar macOS-Styled Mint 22.3 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /mnt/swapfile || true
          if command -v docker >/dev/null 2>&1; then
            docker system prune -af --volumes || true
          fi
          df -h

      - name: Install ISO build tooling and build hackbar.deb
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            squashfs-tools \
            xorriso \
            p7zip-full \
            isolinux \
            syslinux-utils \
            dpkg-dev
          chmod +x hackbar-src/build-deb.sh scripts/customize-chroot.sh
          ./hackbar-src/build-deb.sh

      - name: Download Linux Mint 22.3 XFCE 64-bit ISO
        run: |
          mkdir -p work/iso-src
          curl -fL "https://mirrors.edge.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-xfce-64bit.iso" \
            -o work/linuxmint-22.3-xfce-64bit.iso

      - name: Extract ISO and customize squashfs chroot
        run: |
          mkdir -p work/iso-extract work/squashfs-root
          7z x work/linuxmint-22.3-xfce-64bit.iso -owork/iso-extract -y
          unsquashfs -f -d work/squashfs-root work/iso-extract/casper/filesystem.squashfs

          sudo mount --bind /dev work/squashfs-root/dev
          sudo mount --bind /dev/pts work/squashfs-root/dev/pts
          sudo mount -t proc proc work/squashfs-root/proc
          sudo mount -t sysfs sys work/squashfs-root/sys
          sudo mount -t tmpfs tmpfs work/squashfs-root/run

          cleanup_mounts() {
            sudo umount -lf work/squashfs-root/run 2>/dev/null || true
            sudo umount -lf work/squashfs-root/sys 2>/dev/null || true
            sudo umount -lf work/squashfs-root/proc 2>/dev/null || true
            sudo umount -lf work/squashfs-root/dev/pts 2>/dev/null || true
            sudo umount -lf work/squashfs-root/dev 2>/dev/null || true
          }
          trap cleanup_mounts EXIT

          sudo cp hackbar.deb work/squashfs-root/tmp/hackbar.deb
          sudo cp scripts/customize-chroot.sh work/squashfs-root/tmp/customize-chroot.sh
          sudo chmod 0755 work/squashfs-root/tmp/customize-chroot.sh
          sudo chroot work/squashfs-root /tmp/customize-chroot.sh

          cleanup_mounts
          trap - EXIT

      - name: Repack squashfs and build hybrid UEFI/BIOS ISO
        run: |
          sudo chroot work/squashfs-root dpkg-query -W --showformat='${Package} ${Version}\n' \
            | sudo tee work/iso-extract/casper/filesystem.manifest >/dev/null
          printf '%s\n' "$(sudo du -sx --block-size=1 work/squashfs-root | cut -f1)" \
            | sudo tee work/iso-extract/casper/filesystem.size >/dev/null

          sudo rm -f work/iso-extract/casper/filesystem.squashfs
          sudo mksquashfs work/squashfs-root work/iso-extract/casper/filesystem.squashfs \
            -comp zstd -Xcompression-level 3 -b 1M

          (
            cd work/iso-extract
            sudo find . -type f ! -name 'MD5SUMS' ! -path './isolinux/*' -print0 \
              | xargs -0 sudo md5sum \
              | sudo tee MD5SUMS >/dev/null
          )

          MBR_TEMPLATE="$(mktemp)"
          dd if=work/linuxmint-22.3-xfce-64bit.iso bs=1 count=432 of="${MBR_TEMPLATE}" status=none

          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "HackBarMint223" \
            -eltorito-boot isolinux/isolinux.bin \
            -eltorito-catalog isolinux/boot.cat \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -isohybrid-mbr "${MBR_TEMPLATE}" \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -o work/hackbar-mint-22.3-xfce-amd64.iso \
            work/iso-extract

          rm -f "${MBR_TEMPLATE}"

      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: HackBar macOS-Styled Linux Mint 22.3 XFCE (${{ github.run_number }})
          files: work/hackbar-mint-22.3-xfce-amd64.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
